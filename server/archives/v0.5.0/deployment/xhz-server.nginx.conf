server {
    listen 80;
    server_name xhz-server.sidcloud.cn;
    root /var/www/incense-debt-public;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name xhz-server.sidcloud.cn;
    ssl_certificate /etc/letsencrypt/live/incense-debt-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incense-debt-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IncenseDebtTLS:1m;
    ssl_session_timeout 1d;
    access_log off;
    error_log /var/log/incense-debt-nginx-error.log warn;
    root /var/www/incense-debt-public;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { try_files /index.html =404; }
    location = /health {
        proxy_pass http://127.0.0.1:18778/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control no-store always;
    }
    location = /play {
        proxy_pass http://127.0.0.1:18777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        gzip off;
    }
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 404; }
}
